name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  test:
    name: SwiftPM
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Check timeout helper
        run: |
          set +e
          scripts/swift-test-timeout.sh 5 /bin/sh -c 'exit 7'
          exit_status=$?
          set -e
          test "$exit_status" -eq 7

          timeout_dir="$(mktemp -d)"
          set +e
          scripts/swift-test-timeout.sh 1 /bin/sh -c 'sleep 10 & echo $! > "$1/child.pid"; sleep 10' sh "$timeout_dir"
          exit_status=$?
          set -e
          test "$exit_status" -eq 124
          timeout_child="$(cat "$timeout_dir/child.pid")"
          sleep 1
          if kill -0 "$timeout_child" 2>/dev/null; then
            kill -KILL "$timeout_child" 2>/dev/null || true
            exit 1
          fi
          rm -rf "$timeout_dir"

          cleanup_dir="$(mktemp -d)"
          scripts/swift-test-timeout.sh 5 /bin/sh -c 'sleep 10 & echo $! > "$1/child.pid"; exit 0' sh "$cleanup_dir"
          cleanup_child="$(cat "$cleanup_dir/child.pid")"
          sleep 1
          if kill -0 "$cleanup_child" 2>/dev/null; then
            kill -KILL "$cleanup_child" 2>/dev/null || true
            exit 1
          fi
          rm -rf "$cleanup_dir"

      - name: Build
        run: scripts/swift-test-timeout.sh 300 swift build --build-tests

      - name: Test
        run: scripts/swift-test-timeout.sh 30 swift test --skip-build

      - name: Trait tests
        run: |
          scripts/swift-test-timeout.sh 300 swift test --disable-default-traits --traits OpenVAFCLI --scratch-path .build-openvafcli
          scripts/swift-test-timeout.sh 300 swift test --disable-default-traits --traits VerilogACompiler --scratch-path .build-verilogacompiler
          scripts/swift-test-timeout.sh 300 swift test --disable-default-traits --scratch-path .build-notraits

      - name: Thread Sanitizer
        run: scripts/swift-test-timeout.sh 300 swift test --sanitize=thread

  openvaf-oracle:
    name: Pinned OpenVAF oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned OpenVAF corpus
        uses: actions/checkout@v5
        with:
          repository: pascalkuthe/OpenVAF
          ref: a9697ae7780518f021f9f64e819b3a57033bd39f
          path: .openvaf-upstream

      - name: Install and verify pinned OpenVAF
        env:
          OPENVAF_INSTALLATION_EVIDENCE: ${{ github.workspace }}/.real-tool-evidence/openvaf-installation.json
          OPENVAF_INSTALL_ROOT: ${{ runner.temp }}/openvaf
          OPENVAF_SHIM_PATH: ${{ runner.temp }}/bin/openvaf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils libc6-dev
          scripts/install-openvaf-oracle.sh

      - name: Run mandatory production-API qualification
        env:
          OPENVAF_BIN: ${{ runner.temp }}/bin/openvaf
          OPENVAF_EXPECTED_BINARY_SHA256: 6918195bc6cca54016095923bea190f7a1d96dd8b062104c602e8c28578cb5e3
          OPENVAF_UPSTREAM_ROOT: ${{ github.workspace }}/.openvaf-upstream
          OPENVAF_EVIDENCE_ROOT: ${{ github.workspace }}/.real-tool-evidence/qualification
        run: |
          mkdir -p .real-tool-evidence
          scripts/swift-test-timeout.sh 600 swift run openvaf-qualification

      - name: Retain real-tool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvaf-oracle-evidence
          if-no-files-found: error
          path: .real-tool-evidence
          include-hidden-files: true

  frontend-parity:
    name: Pinned frontend parity
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned OpenVAF corpus
        uses: actions/checkout@v5
        with:
          repository: pascalkuthe/OpenVAF
          ref: a9697ae7780518f021f9f64e819b3a57033bd39f
          path: .openvaf-upstream

      - name: Run pinned frontend parity through Xcode
        env:
          OPENVAF_UPSTREAM_ROOT: ${{ github.workspace }}/.openvaf-upstream
        run: |
          mkdir -p .test-results
          scripts/swift-test-timeout.sh 600 \
            xcodebuild test \
              -quiet \
              -scheme swift-openvaf-Package \
              -destination 'platform=macOS' \
              -resultBundlePath .test-results/OpenVAFFrontendParity.xcresult \
              -only-testing:OpenVAFSupportTests/OpenVAFUpstreamFrontendParityTests/compilerFrontendValuesMatchOpenVAFFrontendFixtures \
              -only-testing:OpenVAFSupportTests/OpenVAFUpstreamFrontendParityTests/compilerFrontendParameterValuesExcludeUpstreamConstraintClauses

      - name: Retain frontend parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvaf-frontend-parity
          if-no-files-found: error
          path: .test-results/OpenVAFFrontendParity.xcresult
