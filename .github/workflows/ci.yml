name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  test:
    name: SwiftPM
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          perl -e '
            my $pid = fork();
            die "fork failed\n" unless defined $pid;
            if ($pid == 0) {
              exec @ARGV or die "exec failed: $!\n";
            }
            local $SIG{ALRM} = sub {
              kill "TERM", $pid;
              sleep 1;
              kill "KILL", $pid;
            };
            alarm 30;
            waitpid($pid, 0);
            my $status = $?;
            alarm 0;
            exit($status >> 8);
          ' swift test
